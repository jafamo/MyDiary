monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        - http # Una línea por petición HTTP con su código de estado (App\EventListener\HttpRequestLogListener)

when@dev:
    monolog:
        handlers:
            main:
                type: rotating_file
                path: "/var/log/php-diary/app-%kernel.environment%.log"
                max_files: 60
                level: debug
                channels: ["!event"]
                formatter: App\Logger\FlattenedContextJsonFormatter
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
            test:
                type: test
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation", "!http", "!app", "!messenger"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            # Sin buffer: los INFO de estos canales (peticiones HTTP, eventos de la
            # app, estado de Messenger) se escriben aunque no haya ningún error.
            structured:
                type: rotating_file
                path: "/var/log/php-diary/app-%kernel.environment%.log"
                max_files: 60
                level: info
                channels: ["http", "app", "messenger"]
                formatter: App\Logger\FlattenedContextJsonFormatter
            nested:
                type: rotating_file
                path: "/var/log/php-diary/app-%kernel.environment%.log"
                max_files: 60
                level: debug
                formatter: App\Logger\FlattenedContextJsonFormatter
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: App\Logger\FlattenedContextJsonFormatter
