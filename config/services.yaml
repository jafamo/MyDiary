# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.audio_storage_dir: '%kernel.project_dir%/var/audio'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            string $botToken: '%env(TELEGRAM_BOT_TOKEN)%'
            string $authorizedChatId: '%env(TELEGRAM_AUTHORIZED_CHAT_ID)%'
            string $webhookToken: '%env(TELEGRAM_WEBHOOK_TOKEN)%'
            string $publicUrl: '%env(APP_PUBLIC_URL)%'
            string $openWebUiBaseUrl: '%env(OPENWEBUI_STT_BASE_URL)%'
            string $openWebUiApiKey: '%env(OPENWEBUI_API_KEY)%'
            string $whisperModel: '%env(WHISPER_MODEL)%'
            string $audioStorageDir: '%app.audio_storage_dir%'
            string $transcriptionStorageDir: '%kernel.project_dir%/var/transcriptions'
            string $ollamaBaseUrl: '%env(OLLAMA_BASE_URL)%'
            string $ollamaModel: '%env(OLLAMA_MODEL)%'
            string $ollamaEmbeddingModel: '%env(OLLAMA_EMBEDDING_MODEL)%'
            string $summaryPromptFile: '%kernel.project_dir%/config/prompts/daily_summary.md'
            string $publicDir: '%kernel.project_dir%/public'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    App\Contract\TranscriberInterface: '@App\Service\Whisper\WhisperTranscriber'
    App\Contract\SummaryGeneratorInterface: '@App\Service\Ollama\OllamaSummaryGenerator'
    App\Contract\EmbeddingGeneratorInterface: '@App\Service\Ollama\OllamaEmbeddingGenerator'
    App\Contract\AudioProbeInterface: '@App\Service\Audio\FfprobeAudioProbe'

when@test:
    parameters:
        # Los tests no escriben en el almacenamiento real de audios.
        app.audio_storage_dir: '%kernel.cache_dir%/audio'

    services:
        # ffprobe no está disponible en CI: los tests usan un doble del sondeo de audio.
        App\Tests\Double\FakeAudioProbe:
            public: true
        App\Contract\AudioProbeInterface: '@App\Tests\Double\FakeAudioProbe'
