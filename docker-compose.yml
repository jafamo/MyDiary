networks:
  diary:
    name: diary-network

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  diary-postgres:
    image: postgres:${POSTGRES_VERSION}
    container_name: diary-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${DATA_PATH}/postgres:/var/lib/postgresql/data
      - ${LOGS_PATH}/postgres:/var/log/postgresql
    networks:
      - diary
    logging: *default-logging

  diary-redis:
    image: redis:${REDIS_VERSION}
    container_name: diary-redis
    command: ["redis-server", "--logfile", "/var/log/redis/redis.log"]
    volumes:
      - ${LOGS_PATH}/redis:/var/log/redis
    networks:
      - diary
    logging: *default-logging

  diary-php:
    build:
      context: ./docker/php
      args:
        PHP_VERSION: ${PHP_VERSION}
    container_name: diary-php
    volumes:
      - ./:/var/www/html
      - ${DATA_PATH}/audio:/var/www/html/var/audio
      - ${DATA_PATH}/transcriptions:/var/www/html/var/transcriptions
      - ${LOGS_PATH}/php:/var/log/php-diary
    depends_on:
      - diary-postgres
      - diary-redis
    networks:
      - diary
    logging: *default-logging

  diary-filebeat:
    image: docker.elastic.co/beats/filebeat:${FILEBEAT_VERSION}
    container_name: diary-filebeat
    user: root
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ${LOGS_PATH}:/logs:ro
      - ${DATA_PATH}/filebeat:/usr/share/filebeat/data
    environment:
      ELASTICSEARCH_HOSTS: ${ELASTICSEARCH_HOSTS}
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME:-}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:-}
      KIBANA_HOST: ${KIBANA_HOST:-}
    depends_on:
      - diary-php
      - diary-nginx
    networks:
      - diary
    logging: *default-logging

  diary-messenger-worker:
    build:
      context: ./docker/php
      args:
        PHP_VERSION: ${PHP_VERSION}
    container_name: diary-messenger-worker
    command: ["php", "bin/console", "messenger:consume", "async", "scheduler_default", "-vv"]
    volumes:
      - ./:/var/www/html
      - ${DATA_PATH}/audio:/var/www/html/var/audio
      - ${DATA_PATH}/transcriptions:/var/www/html/var/transcriptions
      - ${LOGS_PATH}/messenger-worker:/var/log/php-diary
    depends_on:
      - diary-redis
      - diary-postgres
    networks:
      - diary
    logging: *default-logging

  diary-nginx:
    image: nginx:${NGINX_VERSION}
    container_name: diary-nginx
    ports:
      - "${NGINX_HTTP_PORT:-9008}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./:/var/www/html:ro
      - ${LOGS_PATH}/nginx:/var/log/nginx-diary
    depends_on:
      - diary-php
    networks:
      - diary
    logging: *default-logging
