name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create GitHub Release from CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "La GitHub Release $VERSION ya existe; nada que hacer."
            exit 0
          fi

          # Mismo awk que AGENTS.md; el patrón va por ENVIRON porque awk -v interpreta los escapes
          export PATTERN="^## \\[${VERSION//./\\.}\\]"
          NOTES=$(awk '$0 ~ ENVIRON["PATTERN"] {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md)

          if [ -z "${NOTES//[[:space:]]/}" ]; then
            echo "::error::Falta la sección ## [$VERSION] en CHANGELOG.md, o está vacía."
            exit 1
          fi

          gh release create "$VERSION" --title "$VERSION" --notes "$NOTES" --verify-tag
